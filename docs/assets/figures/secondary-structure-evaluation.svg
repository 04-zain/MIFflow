<title id="title">Centroid membership determines candidate criteria before final count selection</title><desc id="description">The same parent, three candidate outlines and cell positions recur. A precise enlargement of S1 shows a centroid on the boundary included and an intersecting cell outline with an outside centroid excluded. S1 has six cells and three P cells; S2 has five and three; S3 has three and one. Dot plots compare the counts against an inclusive minimum of five and phenotype fractions against an inclusive minimum of 0.4. S1 and S2 satisfy both conditions. Two eligible structures satisfy a regional minimum of one; a maximum of one then retains manually selected S1. S2 remains eligible but omitted; S3 fails criteria. All geometries, thresholds and counts are schematic.</desc>
