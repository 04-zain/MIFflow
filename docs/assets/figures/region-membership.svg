<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title description">
<title id="title">Overlapping candidate membership, regional denominators and distinct cells</title>
<desc id="description">Schematic of six segmented cell polygons in one image and cell population. Candidate A covers the centroids of cells 1, 2, 3 and 4; candidate B covers 3, 4 and 5. Cell 2 is included on the boundary of A. The outline of cell 6 crosses A, but its centroid is outside both candidates, so it has no membership. Selected phenotype P occurs in cells 1, 3 and 6. Cell 4 is Unclassified in a complete phenotyping population. The relation table retains all seven candidate-cell associations, including two memberships each for cells 3 and 4. Regional phenotype fractions use every member cell: two of four for A and one of three for B. The drawn candidate areas are 60000 and 40000 square pixels. The illustrative calibration of one micrometre per pixel on both axes gives areas 0.060 and 0.040 square millimetres and selected-phenotype densities 33.3 and 25.0 cells per square millimetre. The distinct union includes five cells, two of which have phenotype P. Cell IDs abbreviate the complete identities shared by these panels. These are geometric examples, not measured tissue data.</desc>
