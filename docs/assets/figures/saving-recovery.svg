<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="748" viewBox="0 0 1000 748" role="img" aria-labelledby="title description">
<title id="title">Closed Parquet data becomes selectable only after complete dataset publication</title>
<desc id="description">Within an owned staging directory, a Parquet part receives row groups. Closing writes its footer; synchronization and one footer check establish schema and row count. Once the parts, layout index, ID index and dataset description are complete, the producer publishes the dataset directory. The coordinator then replaces the small selected reference. The selection timeline stays on V0 until the atomic handover to V1, while a reader that already opened V0 keeps that version for its operation. A failed current cell-dataset build removes its own staging and a retry rebuilds that incomplete candidate; no per-part recovery is implied. Files and version names are illustrative.</desc>
