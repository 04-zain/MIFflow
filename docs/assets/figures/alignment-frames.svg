<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="931" viewBox="0 0 1000 931" role="img" aria-labelledby="title description">
<title id="title">Calibrated point transfer and reverse image sampling</title>
<desc id="description">A mathematical translation example compares a moving image at 0.25 micrometres per pixel with a fixed mIF image at 0.5 micrometres per pixel. Both grid steps represent 50 micrometres. The physical fixed-to-moving map E(u)=u+(100,50) micrometres maps fixed physical (100,50) to moving physical (200,100). Annotation transfer therefore maps moving pixel (800,400) to fixed pixel (200,100) through D_m, E inverse and D_f inverse. Overlay sampling starts at that fixed pixel and applies D_f, E and D_m inverse to recover the moving position. The polygon and grids are schematic, not a fitted registration or observed tissue image. The image axes point right and down.</desc>
