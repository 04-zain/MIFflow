<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="720" height="234" viewBox="0 0 720 234" role="img" aria-labelledby="title description">
  <title id="title">Four section images grouped by subject and by imaging conditions</title>
  <desc id="description">Each slide has a unique sample name. Mouse07 supplied the first two slides, Mouse08 the third and Mouse09 the fourth. The first three share panel-A-run1. The fourth belongs to panel-B-run1.</desc>
  <defs>
