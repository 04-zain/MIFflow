      <rect x="0.75" y="0.75" width="101.5" height="42.5" rx="2" fill="#fff" stroke="#84969b" stroke-width="1.5"/>
      <path d="M2 2H20V42H2Z" fill="#e6edef"/>
      <path d="M20 1V43" stroke="#b7c6ca"/>
      <path d="M7 11H15M7 15H13" stroke="#9aaeb3" stroke-width="1.5"/>
    </g>
    <path id="tissue07" d="M35 20C34 15 39 9 46 10C53 6 61 12 67 13C71 14 77 12 82 17C88 23 82 29 76 30C68 35 62 29 57 31C49 35 44 31 42 28C38 27 36 24 35 20Z"/>
  </defs>
  <rect width="720" height="234" fill="#fff"/>
  <g font-family="'Source Sans 3','DejaVu Sans',sans-serif" fill="#253c47">
    <g font-size="14" font-weight="600">
      <text x="12" y="29">Processing</text>
      <text x="12" y="47">group</text>
      <text x="12" y="144">Sample name</text>
      <text x="12" y="204">Subject ID</text>
    </g>
    <rect x="118" y="12" width="433" height="45" rx="3" fill="#e6f3f1"/>
    <rect x="563" y="12" width="145" height="45" rx="3" fill="#eaf1f7"/>
    <path d="M118 55H551" stroke="#057e79" stroke-width="3"/>
    <path d="M563 55H708" stroke="#4a7293" stroke-width="3"/>
    <g text-anchor="middle" font-size="16" font-weight="600">
      <text x="334.5" y="41" fill="#145953">panel-A-run1</text>
      <text x="635.5" y="41" fill="#335975">panel-B-run1</text>
    </g>
    <g transform="translate(138,76)">
      <use xlink:href="#slide"/>
      <use xlink:href="#tissue07" fill="#b9cdca" stroke="#758e8c"/>
      <path d="M43 24Q52 13 61 20T78 21" stroke="#f4f7f5" stroke-width="1.8" fill="none"/>
    </g>
    <g transform="translate(284,76)">
