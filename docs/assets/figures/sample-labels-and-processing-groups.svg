      <path d="M35 20Q37 12 47 13Q54 15 62 11Q70 8 74 15Q77 20 84 23Q88 30 80 32Q74 34 67 29Q60 24 51 27Q39 31 35 20Z" fill="#b9cdca" stroke="#758e8c"/>
      <path d="M44 19Q53 23 64 18T78 25" stroke="#f4f7f5" stroke-width="1.8" fill="none"/>
