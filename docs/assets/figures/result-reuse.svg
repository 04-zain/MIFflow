<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="592" viewBox="0 0 1000 592" role="img" aria-labelledby="title description">
<title id="title">A reviewed threshold reuses matching predictions and preserves every original score</title>
<desc id="description">An illustrative prediction R1 and the current selection identify the same population P1, measurements M1 and model F1. The reviewed threshold t partitions scores into q below t and q at least t. Retained raw rows have q1 above t, q2 exactly t and q3 below t. The selected classification keeps the first two predicted classes, including equality, and marks the third Unclassified with explicit rejection. Every row retains its ID and original score. This reuse applies to a supported matching prediction selection; score meaning belongs to its model.</desc>
<rect width="1000" height="592" fill="#FFFFFF"/>
<defs><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#243746" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#007D83" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#356E9A" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526773" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
