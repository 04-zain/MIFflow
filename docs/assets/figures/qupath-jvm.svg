<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="675" viewBox="0 0 1100 675" role="img" aria-labelledby="title description">
<title id="title">Stage calls and calculations inside the QuPath JVM</title>
<desc id="description">Groovy source compiles when QuPath runs the stage. The application build compiles Java processing classes into the extension JAR. Inside one JVM, Groovy obtains the project image through QuPath and calls compiled calculation methods. Those methods use QuPath image and ROI objects to prepare feature rows and call native OpenCV for RF or SVM fitting. The displayed feature matrix and random-forest tree are schematic.</desc>
