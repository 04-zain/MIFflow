<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title description">
<title id="title">Reservations move into residency while cache and tensor lifetimes stay bounded</title>
<desc id="description">Local work uses eighty percent of currently available RAM. Cluster work additionally fits within eighty percent of the actual job allocation J. R is current observed process residency, F the nonresident part of baseline plus leased working sets, and D the next estimated demand. Admission requires F plus D at most eighty percent of available host memory. Cluster jobs also require R plus F plus D at most eighty percent of J. Allocating delta of a prior reservation increases R and decreases F by the same amount. Cache ceilings total twenty percent of one operation allowance, split fifty percent image, thirty-six percent objects, four percent features and ten percent metadata. Two queue slots illustrate bounded admission, while the lifetime diagram separates a retained model session from per-call temporary tensors. Bar widths and time spans are schematic.</desc>
<rect width="1000" height="1100" fill="#FFFFFF"/>
<defs><marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#243746" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#007D83" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#356E9A" stroke-width="1.5" stroke-linejoin="round"/></marker><marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526773" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
