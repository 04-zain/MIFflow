<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="title description">
<title id="title">Complete cell bounds select a spatial group before exact outline filtering</title>
<desc id="description">An illustrative cell with centroid x4094 belongs to home block zero but extends to x4108. A viewport beginning at x4096 intersects its outline. The complete-geometry bounds of group G0 therefore remain candidates in the retained layout index. Readers obtain that group&#x27;s base geometry and aligned selected phenotype component. Exact outline intersection retains cell i1 and removes candidate i2. The phenotype dictionary belongs to the selected field and result version. Coordinates shown are level-zero image pixels; table identifiers and codes are illustrative.</desc>
