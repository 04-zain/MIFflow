<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" role="img" aria-labelledby="title description">
<title id="title">Logistic responses and normalized multiclass cell scores</title>
<desc id="description">A hypothetical three-class model multiplies its three-by-three coefficient matrix by the augmented query vector (1, 2, −1). The intercept is the first coefficient in each class row. Linear responses 1.8, zero and −1.2 become sigmoid responses 0.8581, 0.5 and 0.2315. Dividing each by their sum 1.5896 gives cell scores 0.5398, 0.3145 and 0.1456; A has the largest score. The classes have separate class-against-rest responses.</desc>
