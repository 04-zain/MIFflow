<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="925" viewBox="0 0 1000 925" role="img" aria-labelledby="title description">
<title id="title">A spatial image chunk, its encoded range and its native reader</title>
<desc id="description">At one stored level, shard zero has a four by four grid of all-channel C by 256 by 256 chunks. Chunk A at inner c,y,x index 0,1,2 covers x 512 to 768 and y 256 to 512. The matching end-index entry records offset o and length n in the shard file c/0/0/0; a range read selects its encoded bytes, whose position is independent of the spatial grid. In the same JVM, QuPath requests a region and its ImageServer resolves decoded tiles. A missing tile triggers a zarr-java read and decode; the all-channel tile returns to the server and supplies the requested pixels. Retained decoded entries can be reused without reading those bytes again.</desc>
