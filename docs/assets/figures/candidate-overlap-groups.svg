<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Relationships between pending cell outlines</title>
<desc id="desc">Separate examples of disjoint, touching, overlapping and contained candidate polygons. Positive shared interior area places a pair in one pending group. The later native merger and overlap correction determine their final outlines.</desc>
<rect width="1000" height="350" fill="white"/>
<text x="20" y="30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#243746">A  Separated</text>
<rect x="40" y="95" width="78" height="92" fill="#007D83" fill-opacity="0.09" stroke="#007D83" stroke-width="2"/>
<text x="47" y="117" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#007D83">A</text>
<rect x="143" y="95" width="78" height="92" fill="#356E9A" fill-opacity="0.09" stroke="#356E9A" stroke-width="2"/>
<text x="150" y="117" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#356E9A">B</text>
<text x="28" y="267" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#243746">No shared interior</text>
<text x="28" y="304" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#243746">Separate pending groups</text>
<text x="270" y="30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#243746">B  Shared edge</text>
<rect x="290" y="95" width="78" height="92" fill="#007D83" fill-opacity="0.09" stroke="#007D83" stroke-width="2"/>
<text x="297" y="117" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#007D83">A</text>
<rect x="368" y="95" width="78" height="92" fill="#356E9A" fill-opacity="0.09" stroke="#356E9A" stroke-width="2"/>
<text x="375" y="117" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#356E9A">B</text>
<text x="278" y="267" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#243746">Edge contact only</text>
<text x="278" y="304" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#243746">Separate pending groups</text>
<text x="520" y="30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#243746">C  Shared interior</text>
<rect x="540" y="95" width="95" height="92" fill="#007D83" fill-opacity="0.09" stroke="#007D83" stroke-width="2"/>
<text x="547" y="117" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#007D83">A</text>
<rect x="605" y="125" width="95" height="92" fill="#356E9A" fill-opacity="0.09" stroke="#356E9A" stroke-width="2"/>
<text x="612" y="147" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#356E9A">B</text>
<rect x="605" y="125" width="30" height="62" fill="#E8B352" fill-opacity="0.5"/>
<text x="528" y="267" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#243746">Positive shared area</text>
<text x="528" y="304" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#243746">One pending group</text>
<text x="770" y="30" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#243746">D  Containment</text>
<rect x="790" y="90" width="168" height="130" fill="#007D83" fill-opacity="0.09" stroke="#007D83" stroke-width="2"/>
<text x="797" y="112" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#007D83">A</text>
<rect x="840" y="125" width="66" height="52" fill="#356E9A" fill-opacity="0.09" stroke="#356E9A" stroke-width="2"/>
<text x="847" y="147" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#356E9A">B</text>
<rect x="840" y="125" width="66" height="52" fill="#E8B352" fill-opacity="0.35"/>
<text x="778" y="267" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#243746">Positive shared area</text>
<text x="778" y="304" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#243746">One pending group</text>
</svg>