<text x="173" y="91" font-size="16" fill="#526773" font-weight="400" text-anchor="middle">Band 2</text>
<text x="234" y="91" font-size="16" fill="#526773" font-weight="400" text-anchor="middle">Band 3</text>
<text x="45" y="125" font-size="18" fill="#007D83" font-weight="400" text-anchor="middle">1</text>
<rect x="80" y="102" width="185" height="33" fill="#EAF5F4" stroke="none"/>
<text x="112" y="125" font-size="19" fill="#007D83" font-weight="400" text-anchor="middle">10</text>
<text x="173" y="125" font-size="19" fill="#007D83" font-weight="400" text-anchor="middle">20</text>
<text x="234" y="125" font-size="19" fill="#007D83" font-weight="400" text-anchor="middle">30</text>
<text x="45" y="165" font-size="18" fill="#526773" font-weight="400" text-anchor="middle">2</text>
<rect x="80" y="142" width="185" height="33" fill="#F5F7F8" stroke="none"/>
<text x="173" y="165" font-size="17" fill="#526773" font-weight="400" text-anchor="middle">not used</text>
