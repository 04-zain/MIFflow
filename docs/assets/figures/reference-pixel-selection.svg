<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title description">
<title id="title">Whole-pixel selection and per-band regional means</title>
<desc id="description">Constructed example of six pixels in one region and three measurement bands. Each row is one complete pixel spectrum. Pixels 1, 3 and 5 have corrected intensities (10,20,30), (14,18,28) and (12,22,32). Pixel 2 is excluded because a source detector-count band reaches the saturation cutoff; its corrected values are omitted. Pixel 4 has zero corrected spectral length and is excluded. Pixel 6 has a nonfinite band and its entire spectrum is excluded. Averaging the same three retained pixels in each band gives the regional mean (12,20,30). Saturation uses acquired detector counts before intensity correction, whereas minimum spectral signal uses the L2 length after correction. Values are illustrative, not measured data.</desc>
<rect width="1000" height="410" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#243746" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#243746">
