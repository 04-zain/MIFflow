<text x="916" y="212" font-size="19" fill="#007D83" font-weight="400" text-anchor="middle">32</text>
<path d="M738 225 V251" fill="none" stroke="#243746" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M827 225 V251" fill="none" stroke="#243746" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M916 225 V251" fill="none" stroke="#243746" stroke-width="1.2" marker-end="url(#arrow)"/>
