<text x="285" y="159" font-size="17" fill="#946A21" font-weight="400" text-anchor="start">Saturated detector count</text>
<text x="285" y="180" font-size="16" fill="#526773" font-weight="400" text-anchor="start">Any band, before correction</text>
<text x="45" y="205" font-size="18" fill="#007D83" font-weight="400" text-anchor="middle">3</text>
<rect x="80" y="182" width="185" height="33" fill="#EAF5F4" stroke="none"/>
<text x="112" y="205" font-size="19" fill="#007D83" font-weight="400" text-anchor="middle">14</text>
<text x="173" y="205" font-size="19" fill="#007D83" font-weight="400" text-anchor="middle">18</text>
<text x="234" y="205" font-size="19" fill="#007D83" font-weight="400" text-anchor="middle">28</text>
<text x="45" y="245" font-size="18" fill="#526773" font-weight="400" text-anchor="middle">4</text>
<rect x="80" y="222" width="185" height="33" fill="#F5F7F8" stroke="none"/>
<text x="112" y="245" font-size="19" fill="#526773" font-weight="400" text-anchor="middle">0</text>
