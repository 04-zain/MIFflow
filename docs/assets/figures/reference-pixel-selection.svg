<text x="285" y="340" font-size="16" fill="#526773" font-weight="400" text-anchor="start">Entire pixel excluded</text>
<path d="M78 98 H70 V340 H78" fill="none" stroke="#243746" stroke-width="1.4"/>
<path d="M267 98 H275 V340 H267" fill="none" stroke="#243746" stroke-width="1.4"/>
