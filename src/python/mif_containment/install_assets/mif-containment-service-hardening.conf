[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/mif-pipeline/containment
ProtectHome=read-only
ReadOnlyPaths=/sys/fs/cgroup
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
CapabilityBoundingSet=CAP_KILL CAP_SETUID CAP_SETGID CAP_SYS_PTRACE CAP_SETPCAP
AmbientCapabilities=
SystemCallFilter=~ptrace:EPERM process_vm_readv:EPERM process_vm_writev:EPERM
